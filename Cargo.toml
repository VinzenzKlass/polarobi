[package]
name = "polarobi"
version = "0.1.6"
edition = "2024"
description = "Add Gurobi variables and constraints straight from Arrow/polars memory, compatible with gurobipy."

[lib]
name = "_native"
# `rlib` too, so that `benches/native.rs` can call the pure Rust stages directly.
crate-type = ["cdylib", "rlib"]

[dependencies]
# Must match the arrow version pyo3-arrow is built on, or their types are incompatible.
arrow-array = "59"
arrow-schema = "59"
libloading = "0.9.0"
pyo3 = { version = "0.29.3", features = ["abi3-py312"] }
# We do not need buffer-protocol input. pyo3-arrow still compiles in the Rust numpy crate, which
# only imports Python numpy when its functions are called; our code paths never call them.
pyo3-arrow = { version = "0.19", default-features = false }

[dev-dependencies]
# The same stages under divan, measured by CodSpeed in CI, see benches/stages.rs.
divan = { version = "5.0.3", package = "codspeed-divan-compat" }
# Instruction and allocation counts under Valgrind, see benches/native.rs. Linux only.
iai-callgrind = "0.16.1"

[[bench]]
name = "native"
harness = false

[[bench]]
# Wall-clock timings of the same stages, see benches/timing.rs. Runs anywhere.
name = "timing"
harness = false

[[bench]]
# The same stages again, for CodSpeed: CPU simulation, memory and wall time, see
# benches/stages.rs and .github/workflows/codspeed.yml.
name = "stages"
harness = false

[target."cfg(unix)".dependencies]
libc = "0.2.190"

[profile.release]
# One codegen unit with whole-program LTO: the hot paths cross the arrow and pyo3 crates.
# Panics must keep unwinding, pyo3 turns them into `PanicException`.
lto = "fat"
codegen-units = 1
