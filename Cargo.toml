[package]
name = "polarobi"
version = "0.1.6"
edition = "2024"
description = "Add Gurobi variables and constraints straight from Arrow/polars memory, compatible with gurobipy."

[lib]
name = "_native"
# `rlib` too, so that the benchmarks in `benches/` can call the pure Rust stages directly.
crate-type = ["cdylib", "rlib"]

[dependencies]
# Must match the arrow version pyo3-arrow is built on, or their types are incompatible.
arrow-array = "59"
arrow-schema = "59"
libloading = "0.9.0"
pyo3 = { version = "0.29.3", features = ["abi3-py312"] }
# We do not need buffer-protocol input. pyo3-arrow still compiles in the Rust numpy crate, which
# only imports Python numpy when its functions are called; our code paths never call them.
pyo3-arrow = { version = "0.19", default-features = false }

[dev-dependencies]
# Divan, instrumented by CodSpeed when built with `cargo codspeed build`, see benches/stages.rs.
divan = { version = "5.0.3", package = "codspeed-divan-compat" }

[[bench]]
name = "stages"
harness = false

[target."cfg(unix)".dependencies]
libc = "0.2.190"

[profile.release]
# One codegen unit with whole-program LTO: the hot paths cross the arrow and pyo3 crates.
# Panics must keep unwinding, pyo3 turns them into `PanicException`.
lto = "fat"
codegen-units = 1
