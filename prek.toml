default_language_version.python = "3.14"

repos = [
    {
        repo = "https://github.com/astral-sh/uv-pre-commit",
        rev = "0.12.1",
        hooks = [{ id = "uv-lock", priority = 0 }]
    },
    {
        repo = "https://github.com/astral-sh/ruff-pre-commit",
        rev = "v0.16.1",
        hooks = [
            { id = "ruff-format", priority = 0 },
            { id = "ruff-check", args = ["--fix"], priority = 1 }
        ]
    },
    {
        repo = "https://github.com/DetachHead/basedpyright-pre-commit-mirror",
        rev = "1.39.9",
        hooks = [
            { id = "basedpyright", pass_filenames = false, always_run = true, args = ["--threads", "8"], priority = 0 }
        ]
    },
    {
        # The Rust extension. Uses the rustup toolchain on PATH, with its rustfmt and clippy components.
        repo = "local",
        hooks = [
            { id = "cargo-fmt", name = "cargo fmt", entry = "cargo fmt --all", language = "system", types = ["rust"], pass_filenames = false, priority = 0 },
            { id = "cargo-clippy", name = "cargo clippy", entry = "cargo clippy --all-targets --locked -- -D warnings", language = "system", files = '^(src/.*\.rs|Cargo\.(toml|lock))$', pass_filenames = false, priority = 1 }
        ]
    }
]
