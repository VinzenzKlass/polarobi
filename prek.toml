default_language_version.python = "3.14"

repos = [
    {
        repo = "https://github.com/astral-sh/uv-pre-commit",
        rev = "0.12.1",
        hooks = [{ id = "uv-lock", priority = 0 }]
    },
    {
        repo = "local",
        hooks = [
            { id = "ruff-format", name = "ruff format", entry = "ruff format --force-exclude", language = "system", types_or = ["python", "pyi", "jupyter"], require_serial = true, priority = 0 },
            { id = "ruff-check", name = "ruff check", entry = "ruff check --force-exclude --fix", language = "system", types_or = ["python", "pyi", "jupyter"], require_serial = true, priority = 1 },
            { id = "basedpyright", name = "basedpyright", entry = "basedpyright --threads 8", language = "system", types_or = ["python", "pyi"], require_serial = true, pass_filenames = false, always_run = true, priority = 0 },
            # The Rust extension. Uses the rustup toolchain on PATH, with its rustfmt and clippy components.
            { id = "cargo-fmt", name = "cargo fmt", entry = "cargo fmt --all", language = "system", types = ["rust"], pass_filenames = false, priority = 0 },
            { id = "cargo-clippy", name = "cargo clippy", entry = "cargo clippy --all-targets --locked -- -D warnings", language = "system", files = '^(src/.*\.rs|Cargo\.(toml|lock))$', pass_filenames = false, priority = 1 },
            # Unit tests of the pure Rust parts. Some start an embedded Python to check error messages.
            { id = "cargo-test", name = "cargo test", entry = "cargo test --locked", language = "system", files = '^(src/.*\.rs|Cargo\.(toml|lock))$', pass_filenames = false, priority = 2 }
        ]
    }
]
