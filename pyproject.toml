[project]
name = "polarobi"
description = "Build gurobipy models from polars frames, passing Arrow memory straight to Gurobi's C API."
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Vinzenz Klass", email = "vinzenz.klass@valantic.com" }]
requires-python = ">=3.12"
dynamic = ["version"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
]
dependencies = [
    "gurobipy>=14.0.0b1,<14.1",
    "polars>=2.0.0",
]
[dependency-groups]
# The benchmark and its figures: the libraries it compares polarobi against, and their type stubs.
bench = [
    "gurobipy-pandas>=1.2.2",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "pandas-stubs>=3.0.5.260914",
    "pyarrow>=26.0.0",
]
dev = [
    "maturin>=1.15.0",
    "prek>=0.5.5",
    "ruff>=0.17.0",
    "basedpyright>=1.40.2",
    "pytest>=9.1.1",
    "hypothesis>=6.169.4",
    # Type checking only: polars' annotations reference numpy types, which are Unknown without
    # it. polarobi itself never imports numpy, tests/test_no_numpy.py guards that.
    "numpy>=2.0",
    "zensical>=0.0.70",
    "mkdocstrings[python]>=1.0.7",
]

[project.urls]
Homepage = "https://vinzenzklass.github.io/polarobi/"
Repository = "https://github.com/VinzenzKlass/polarobi"
Documentation = "https://github.com/VinzenzKlass/polarobi"

[build-system]
requires = ["maturin>=1.15.0"]
build-backend = "maturin"


[tool.maturin]
python-source = "python"
module-name = "polarobi._native"

[tool.uv]
# Rebuild the extension whenever the Rust sources change.
cache-keys = [{ file = "pyproject.toml" }, { file = "Cargo.toml" }, { file = "src/**/*.rs" }]

[tool.pyright]
typeCheckingMode = "strict"
reportUnusedCallResult = false
reportExplicitAny = false
reportAny = false
reportMissingTypeStubs = false

[tool.ruff]
line-length = 100
respect-gitignore = false
fix = true
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "B", "I"]
fixable = ["ALL"]
unfixable = []
[tool.ruff.format]
skip-magic-trailing-comma = true

[tool.ruff.lint.isort]
split-on-trailing-comma = false

[tool.pytest.ini_options]
testpaths = ["tests"]
