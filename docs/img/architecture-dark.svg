<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" width="680" height="320" role="img">
<title>From Arrow memory to Gurobi, with and without polarobi</title>
<defs>
<marker id="gp" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#d95926" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="pl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#3987e5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="mu" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#c3c2b7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<g font-family="Segoe UI, Helvetica, Arial, sans-serif" text-anchor="middle" dominant-baseline="central">
<rect x="40" y="110" width="140" height="80" rx="8" fill="#16171b" stroke="#4a4a46"/>
<text x="110" y="132" font-size="14" font-weight="600" fill="#f0efec">Arrow memory</text>
<text x="110" y="152" font-size="12" fill="#c3c2b7">Columnar buffers</text>
<text x="110" y="170" font-size="12" fill="#c3c2b7">in polars</text>

<rect x="220" y="30" width="130" height="56" rx="8" fill="#2b1810" stroke="#d95926" stroke-dasharray="4 3"/>
<text x="285" y="50" font-size="14" font-weight="600" fill="#f0efec">Python objects</text>
<text x="285" y="68" font-size="12" fill="#c3c2b7">Per row, per term</text>

<rect x="370" y="30" width="120" height="56" rx="8" fill="#16171b" stroke="#4a4a46"/>
<text x="430" y="50" font-size="14" font-weight="600" fill="#f0efec">gurobipy</text>
<text x="430" y="68" font-size="12" fill="#c3c2b7">Copies into C</text>

<rect x="220" y="214" width="270" height="56" rx="8" fill="#0f1e33" stroke="#3987e5"/>
<text x="355" y="234" font-size="14" font-weight="600" fill="#f0efec">polarobi native module</text>
<text x="355" y="252" font-size="12" fill="#c3c2b7">Pointers into Arrow buffers</text>

<rect x="520" y="110" width="120" height="80" rx="8" fill="#16171b" stroke="#4a4a46"/>
<text x="580" y="140" font-size="14" font-weight="600" fill="#f0efec">Gurobi</text>
<text x="580" y="160" font-size="12" fill="#c3c2b7">C library</text>

<g fill="none" stroke-width="1.5">
<path d="M110 108 L110 58 L216 58" stroke="#d95926" stroke-dasharray="4 3" marker-end="url(#gp)"/>
<path d="M350 58 L366 58" stroke="#d95926" stroke-dasharray="4 3" marker-end="url(#gp)"/>
<path d="M490 58 L580 58 L580 106" stroke="#d95926" stroke-dasharray="4 3" marker-end="url(#gp)"/>
<path d="M110 192 L110 242 L216 242" stroke="#3987e5" marker-end="url(#pl)"/>
<path d="M490 242 L580 242 L580 194" stroke="#3987e5" marker-end="url(#pl)"/>
<path d="M430 212 L430 90" stroke="#c3c2b7" stroke-width="1" stroke-dasharray="2 3" marker-end="url(#mu)"/>
</g>
<text x="422" y="150" font-size="12" fill="#c3c2b7" text-anchor="end">Registers handles</text>

<text x="40" y="300" font-size="12" fill="#c3c2b7" text-anchor="start">Dashed: the per-row Python step polarobi skips. Solid: one bulk C call per family.</text>
</g>
</svg>
