name: QA
on: [ push, pull_request ]
jobs:
  Tests:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: 3.14
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
      - name: Install Dependencies
        run: uv sync --dev
      - name: Run Tests
        run: uv run python -m pytest tests/
