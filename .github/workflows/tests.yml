name: QA
on: [ push, pull_request ]
jobs:
  Tests:
    # Forks send no push event here, so their pull requests are the only run they get.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      # Ten times the default examples for the equivalence state machine, see tests/conftest.py.
      HYPOTHESIS_PROFILE: ci
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: 3.14
      # uv sync compiles the extension with maturin.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install Dependencies
        run: uv sync --dev --locked
      - name: Run Tests
        # The statistics show how many examples each Hypothesis test ran under the ci profile.
        run: uv run python -m pytest tests/ --hypothesis-show-statistics
