name: Benchmarks
on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  Benchmarks:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        suite: [ rust, python ]
        mode: [ simulation, memory ]
    name: Benchmarks (${{ matrix.suite }}, ${{ matrix.mode }})
    steps:
      - uses: actions/checkout@v6
      # Python for both: the Rust benches link against it through pyo3.
      - uses: actions/setup-python@v6
        with:
          python-version: 3.14.8
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.suite }}-${{ matrix.mode }}
      - name: Build the Rust Benchmarks
        if: matrix.suite == 'rust'
        run: |
          cargo install cargo-codspeed --locked
          cargo codspeed build --measurement-mode ${{ matrix.mode }}
      - uses: astral-sh/setup-uv@v8.2.0
        if: matrix.suite == 'python'
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install Dependencies
        if: matrix.suite == 'python'
        env:
          CARGO_PROFILE_RELEASE_DEBUG: line-tables-only
          UV_PYTHON: "3.14.8"
        run: uv sync --group dev --group codspeed --locked
      - name: Run Benchmarks
        uses: CodSpeedHQ/action@v5
        env:
          POLARS_MAX_THREADS: "1"
        with:
          mode: ${{ matrix.mode }}
          run: ${{ matrix.suite == 'rust' && 'cargo codspeed run' || 'uv run --no-sync pytest benchmarks/ --codspeed' }}
